<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expenses — Lumora</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="appSidebar">
      <div class="sidebar-header">
        <a href="../index.html" class="brand">
          <span class="brand-mark"><i class="fa-solid fa-layer-group"></i></span>
          <span class="brand-name">Lumora</span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link"><i class="fa-solid fa-gauge-high"></i> Overview</a>
        <a href="expenses.html" class="sidebar-link active"><i class="fa-solid fa-file-invoice-dollar"></i> Expenses</a>
        <a href="categories.html" class="sidebar-link"><i class="fa-solid fa-tags"></i> Categories</a>
        <a href="reports.html" class="sidebar-link"><i class="fa-solid fa-chart-pie"></i> Reports</a>
        <a href="settings.html" class="sidebar-link"><i class="fa-solid fa-gear"></i> Settings</a>
      </nav>
    </aside>
    <div class="main-wrapper">
      <header class="topbar">
        <div style="display:flex; align-items:center; gap:16px;">
          <button class="icon-btn mobile-sidebar-toggle" id="mobileSidebarBtn"><i class="fa-solid fa-bars"></i></button>
          <div>
            <div class="page-title">All Expenses</div>
            <div class="page-subtitle">Search, filter, and manage transactions</div>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-primary btn-sm" id="add-expense-btn"><i class="fa-solid fa-plus"></i> Add
            Expense</button>
        </div>
      </header>
      <main class="content-area">
        <div style="display:flex; gap:16px; flex-wrap:wrap;">
          <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchExpense" class="input-field" placeholder="Search merchant...">
          </div>
          <select id="filterStatus" class="input-field" style="width:160px;">
            <option value="all">All Status</option>
            <option value="paid">Paid</option>
            <option value="pending">Pending</option>
          </select>
          <select id="filterCategory" class="input-field" style="width:180px;">
            <option value="all">All Categories</option>
            <option value="Software">Software</option>
            <option value="Infrastructure">Infrastructure</option>
            <option value="Meals">Meals</option>
          </select>
        </div>
        <div class="table-container">
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th id="thMerchant">Merchant <i class="fa-solid fa-sort"
                      style="font-size:.7rem;opacity:0.5;margin-left:4px;"></i></th>
                  <th>Category</th>
                  <th id="thDate">Date <i class="fa-solid fa-sort"
                      style="font-size:.7rem;opacity:0.5;margin-left:4px;"></i></th>
                  <th id="thAmount">Amount <i class="fa-solid fa-sort"
                      style="font-size:.7rem;opacity:0.5;margin-left:4px;"></i></th>
                  <th>Status</th>
                  <th style="text-align:right;">Actions</th>
                </tr>
              </thead>
              <tbody id="expensesBody"></tbody>
            </table>
          </div>
          <div id="emptyState" class="empty-state">
            <i class="fa-solid fa-receipt"></i>
            <h3>No expenses found</h3>
            <p style="color:var(--text-muted); font-size:.9rem;">Try adjusting your filters or add a new expense.</p>
          </div>
          <div class="pagination">
            <span id="pageInfo">Showing 0-0 of 0</span>
            <div class="page-controls">
              <button class="icon-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
              <button class="icon-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="../main.js"></script>
</body>
</html>
