<!DOCTYPE html>
<html lang="en" data-theme="light" data-theme-mode="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expenses — Lumora</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="nav-wrap">
    <nav class="nav-inner">
      <a href="../index.html" class="brand">
        <span class="brand-mark"><i class="fa-solid fa-circle-half-stroke" style="color:#fff;"></i></span>
        <span class="brand-name">Lumora.</span>
      </a>
      <ul class="nav-menu" id="navMenu">
        <li><a class="nav-link" href="../index.html">Home</a></li>
        <li><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li><a class="nav-link" href="categories.html">Categories</a></li>
        <li><a class="nav-link" href="expenses.html">Expenses</a></li>
        <li><a class="nav-link" href="reports.html">Reports</a></li>
        <li><a class="nav-link" href="settings.html">Settings</a></li>
      </ul>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle">
          <span class="tt-icon tt-sun"><i class="fa-solid fa-sun"></i></span>
          <span class="tt-icon tt-moon"><i class="fa-solid fa-moon"></i></span>
          <span class="tt-thumb"></span>
        </button>
        <button class="menu-btn" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
      </div>
    </nav>
  </header>

  <main class="shell">
    <div class="dash">
      <aside class="dash-side">
        <div class="dash-brand">
          <span class="dash-brand-mark"><i class="fa-solid fa-chart-pie" style="color:#fff;font-size:12px;"></i></span>
          <span class="dash-brand-name">Workspace</span>
        </div>
        <nav class="dash-nav">
          <a href="dashboard.html" class="dash-nav-item"><i class="fa-solid fa-gauge-high"></i>Overview</a>
          <a href="categories.html" class="dash-nav-item"><i class="fa-solid fa-layer-group"></i>Categories</a>
          <a href="expenses.html" class="dash-nav-item"><i class="fa-solid fa-file-invoice-dollar"></i>Expenses</a>
          <a href="reports.html" class="dash-nav-item"><i class="fa-solid fa-chart-line"></i>Reports</a>
          <a href="settings.html" class="dash-nav-item"><i class="fa-solid fa-gear"></i>Settings</a>
        </nav>
      </aside>

      <div class="dash-main">
        <div class="dash-topbar">
          <div>
            <h3 class="dash-title">All Expenses</h3>
            <p class="dash-subtitle">View and manage your transactions</p>
          </div>
          <div class="dash-actions">
            <button class="btn btn-primary btn-sm" id="add-expense-btn"><i class="fa-solid fa-plus"></i> Add Expense</button>
          </div>
        </div>

        <div class="dash-body">
          <div class="table-card">
            <div class="table-head">
              <div class="chart-title" style="margin:0;">Transaction History</div>
            </div>
            <div class="table-scroll">
              <table class="data-table" id="expensesTable">
                <thead>
                  <tr>
                    <th>Merchant</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Amount</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="expensesBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="toast-stack" id="toastStack"></div>
  <script src="../main.js"></script>
</body>
</html>
