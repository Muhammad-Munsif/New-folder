<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports — Lumora</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <div class="app-layout">
    <aside class="sidebar" id="appSidebar">
      <div class="sidebar-header">
        <a href="../index.html" class="brand">
          <span class="brand-mark"><i class="fa-solid fa-layer-group"></i></span>
          <span class="brand-name">Lumora</span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link"><i class="fa-solid fa-gauge-high"></i> Overview</a>
        <a href="expenses.html" class="sidebar-link"><i class="fa-solid fa-file-invoice-dollar"></i> Expenses</a>
        <a href="categories.html" class="sidebar-link"><i class="fa-solid fa-tags"></i> Categories</a>
        <a href="reports.html" class="sidebar-link"><i class="fa-solid fa-chart-pie"></i> Reports</a>
        <a href="settings.html" class="sidebar-link"><i class="fa-solid fa-gear"></i> Settings</a>
      </nav>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div style="display:flex; align-items:center; gap:16px;">
          <button class="icon-btn mobile-sidebar-toggle" id="mobileSidebarBtn"><i class="fa-solid fa-bars"></i></button>
          <div>
            <div class="page-title">Reports</div>
            <div class="page-subtitle">Export your financial data</div>
          </div>
        </div>
      </header>

      <main class="content-area">
        <div class="card" style="max-width:600px;">
          <h3 style="margin-bottom:12px;">Export Transactions</h3>
          <p style="color:var(--text-muted); margin-bottom:24px; font-size:0.95rem;">Download a complete CSV file of all
            your recorded expenses, including dates, categories, and amounts. This file can be opened in Excel or Google
            Sheets.</p>
          <button class="btn btn-primary" id="exportCsvBtn"><i class="fa-solid fa-file-csv"></i> Download CSV</button>
        </div>
      </main>
    </div>
  </div>
  <script src="../main.js"></script>
</body>

</html>
