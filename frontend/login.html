<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — Lumora</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-left">
      <div class="brand" style="color:#fff;">
        <span class="brand-icon" style="background:#fff; color:var(--primary);"><i class="fa-solid fa-layer-group"></i></span>
        <span style="font-size:1.25rem; font-weight:700;">Lumora</span>
      </div>
      <div style="position:relative; z-index:1;">
        <h2>Manage your finances<br>with absolute clarity.</h2>
        <p>A professional dashboard built for modern teams. Track expenses, manage budgets, and export reports seamlessly.</p>
      </div>
      <p style="font-size:0.875rem; opacity:0.6; position:relative; z-index:1;">© 2025 Lumora Inc. All rights reserved.</p>
    </div>

    <div class="auth-right">
      <div class="auth-box">
        <div class="auth-header">
          <h2 id="authTitle">Welcome back</h2>
          <p id="authSubtitle">Enter your credentials to access your account.</p>
        </div>

        <form id="authForm">
          <div class="form-group" id="nameGroup" style="display:none;">
            <label class="form-label">Full Name</label>
            <input type="text" id="authName" class="input-field" placeholder="Ada Lovelace">
          </div>

          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" id="authEmail" class="input-field" placeholder="ada@company.com" required>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" id="authPassword" class="input-field" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;" id="authSubmitBtn">
            Sign In
          </button>
        </form>

        <p class="auth-toggle-text">
          <span id="toggleText">Don't have an account?</span> 
          <a id="toggleAuth">Sign up</a>
        </p>
      </div>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
