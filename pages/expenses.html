<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses | SchoolSys</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'] }, colors: { primary: '#667eea', secondary: '#764ba2' } } }
        }
    </script>
</head>
<body class="font-sans bg-gray-50 overflow-hidden h-screen flex">

    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden lg:hidden transition-opacity"></div>

    <!-- Sidebar (Note the ../ for links pointing back to root) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-gradient-to-br from-primary to-secondary text-white transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col shadow-xl">
        <div class="p-6 border-b border-white/10 flex items-center gap-3">
            <i class="fas fa-graduation-cap text-2xl"></i><h1 class="text-xl font-bold">SchoolSys</h1>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <a href="../index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/80 hover:bg-white/10 hover:text-white border border-transparent transition-all hover:translate-x-1">
                <i class="fas fa-home w-5"></i><span>Dashboard</span>
            </a>
            <a href="expenses.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-white/15 text-white border border-white/20 shadow-md transition-all">
                <i class="fas fa-wallet w-5"></i><span>Expenses</span>
            </a>
            <!-- Add other links here... -->
        </nav>
    </aside>

    <!-- Main Wrapper -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden lg:ml-72 w-full">
        <header class="bg-white shadow-sm z-10 sticky top-0">
            <div class="flex items-center justify-between px-4 sm:px-6 py-4">
                <div class="flex items-center gap-4">
                    <button id="mobileToggle" class="lg:hidden text-gray-600 hover:text-gray-900 focus:outline-none text-xl"><i class="fas fa-bars"></i></button>
                    <h2 class="text-lg sm:text-xl font-bold text-gray-800">Expenses Management</h2>
                </div>
            </div>
        </header>

        <!-- Page Specific Content -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <!-- Responsive Table Wrapper -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-600 text-sm border-b border-gray-200">
                                <th class="p-4 font-semibold">Date</th>
                                <th class="p-4 font-semibold">Title</th>
                                <th class="p-4 font-semibold">Category</th>
                                <th class="p-4 font-semibold text-right">Amount</th>
                            </tr>
                        </thead>
                        <tbody class="text-gray-700 text-sm divide-y divide-gray-100">
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="p-4 whitespace-nowrap">Oct 15, 2026</td>
                                <td class="p-4 font-medium">New Science Lab Equipment</td>
                                <td class="p-4"><span class="px-2 py-1 bg-blue-100 text-blue-700 rounded-md text-xs font-semibold">Materials</span></td>
                                <td class="p-4 text-right font-semibold">$1,200.00</td>
                            </tr>
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="p-4 whitespace-nowrap">Oct 14, 2026</td>
                                <td class="p-4 font-medium">Cafeteria Food Supplies</td>
                                <td class="p-4"><span class="px-2 py-1 bg-green-100 text-green-700 rounded-md text-xs font-semibold">Food</span></td>
                                <td class="p-4 text-right font-semibold">$850.50</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../main.js"></script>
</body>
</html>
